name: Moodle Plugin CI
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  moodle-plugin-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: MOODLE_405_STABLE
            php: '8.1'
          - moodle: MOODLE_500_STABLE
            php: '8.2'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U moodle'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, pdo_pgsql, intl, gd, xml, mbstring, curl, zip, soap
          coverage: none
      - name: Install tooling
        run: composer global require moodlehq/moodle-plugin-ci:^4 --no-interaction
      - name: Install Moodle
        run: |
          export PATH="$HOME/.composer/vendor/bin:$HOME/.config/composer/vendor/bin:$PATH"
          moodle-plugin-ci install --moodle=${{ matrix.moodle }} --db=pgsql --db-host=127.0.0.1 --db-name=moodle --db-user=moodle --db-pass=moodle
      - name: Validate
        run: |
          export PATH="$HOME/.composer/vendor/bin:$HOME/.config/composer/vendor/bin:$PATH"
          moodle-plugin-ci validate
          moodle-plugin-ci phplint
          moodle-plugin-ci codechecker
          moodle-plugin-ci phpunit --fail-on-warning
          moodle-plugin-ci behat --tags=@local_sanitizedclone
